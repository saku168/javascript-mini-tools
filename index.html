<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Mini Tools</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">VANILLA JAVASCRIPT</p><h1>Mini tools</h1>
    <p class="intro">Useful little tools that run directly in your browser.</p>
    <section class="tool"><h2>Character counter</h2><label for="text-input">Your text</label><textarea id="text-input" rows="4" placeholder="Start typing..."></textarea><p id="count" aria-live="polite">0 characters · 0 words</p></section>
    <section class="tool"><h2>Live clock</h2><p id="clock" class="clock">--:--:--</p></section>
    <section class="tool"><h2>Random number picker</h2><div class="fields"><label>Minimum<input id="minimum" type="number" value="1"></label><label>Maximum<input id="maximum" type="number" value="100"></label></div><button id="pick-button" type="button">Pick a number</button><p id="result" aria-live="polite">Your result will appear here.</p></section>
  </main>
</body>
</html>
